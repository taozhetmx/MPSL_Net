# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 4 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  # n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
 s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
 m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
 l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
 x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone
#my_model summary: 130 layers, 3,011,628 parameters, 3,011,612 gradients, 8.1 GFLOPs
#my_model summary: 129 layers, 3,011,628 parameters, 3,011,612 gradients, 8.2 GFLOPs
#my_model summary: 154 layers, 3,050,160 parameters, 3,050,144 gradients, 9.2 GFLOPs
#my_model summary: 166 layers, 3,055,602 parameters, 3,055,586 gradients, 8.8 GFLOPs

#my_model summary: 157 layers, 2,885,744 parameters, 2,885,728 gradients, 7.7 GFLOPs
#my_model summary: 182 layers, 10,931,778 parameters, 10,931,762 gradients, 27.3 GFLOPs
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, FusionConv, [512, 512]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, FusionConv, [1024, 1024]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
#  - [-1, 3, FC2f, [256]] # 15
  - [-1, 3, C2f, [256]] # 12

  # - [-1, 1, GSConvE, [256, 3, 2]]
  # - [-1, 1, RFAConv, [256, 3, 2]]
  - [-1, 1, FDConv_BN, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 18 (P4/16-medium)

  # - [-1, 1, Conv, [512, 3, 2]]
  # - [[-1, 9], 1, Concat, [1]] # cat head P5
  # - [-1, 3, C2f, [1024]] # 21 (P5/32-large)


  - [[15, 18, 9], 1, Detect, [nc]] # Detect(P3, P4, P5)
#  - [[14,17,20], 1, SDetect, [nc]] # Detect(P3, P4, P5)
#  - [[], 1, Detect, [nc]] # Detect(P3, P4, P5)
